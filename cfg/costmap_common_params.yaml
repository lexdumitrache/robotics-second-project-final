# Scout Mini body: 0.612 m long x 0.580 m wide (urdf/scout_mini.urdf.xacro, world/models/scout_mini.inc)
footprint: [[0.306, 0.29], [0.306, -0.29], [-0.306, -0.29], [-0.306, 0.29]]
footprint_padding: 0.02

map_type: costmap_2d

obstacle_layer:
  enabled:              true
  combination_method:   1
  track_unknown_space:  true    #true needed for disabling global path planning through unknown space
  obstacle_range: 2.5  # maximum range in meters at which to insert obstacles into the costmap using sensor data
  raytrace_range: 3.0 # maximum range in meters at which to raytrace out obstacles from the map using sensor data
  observation_sources:  scan
  scan:
    data_type: LaserScan
    topic: base_scan   # published by stageros
    marking: true
    clearing: true
    # The 2D Stage laser sits ~0.13 m above the floor; keep it inside the accepted height band
    min_obstacle_height: 0.0
    max_obstacle_height: 1.0

#cost_scaling_factor and inflation_radius were now moved to the inflation_layer ns
inflation_layer:
  enabled:              true
  cost_scaling_factor:  5.0  # exponential rate at which the obstacle cost drops off (default: 10)
  inflation_radius:     0.55  # > circumscribed radius (0.42 m) so paths keep clear of walls

static_layer:
  enabled:              true
